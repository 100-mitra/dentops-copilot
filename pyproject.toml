# Tool configuration only (pytest + ruff). Not a packaging manifest — deps live
# in requirements.txt and the app runs as a namespace package from the repo root.

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
# Use ruff's default lint set (E4/E7/E9 + F) — matches the scaffold's style
# (grouped imports, Optional[...]) so `ruff check backend` stays green without
# churning the provided spine files.
