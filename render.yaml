# Render blueprint (one option — see docs/DEPLOY.md for Railway/Fly alternatives).
# Deploys the API + a managed Postgres. Set ANTHROPIC_API_KEY in the dashboard (secret).
services:
  - type: web
    name: dentops-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set as a secret in the Render dashboard
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: DATABASE_URL
        fromDatabase:
          name: dentops-db
          property: connectionString
      - key: CONFIDENCE_THRESHOLD
        value: "0.7"

databases:
  - name: dentops-db
    plan: free
